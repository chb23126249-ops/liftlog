    .sort-btn{background:var(--orange);border-color:var(--orange);color:#fff}.sort-btn:hover{border-color:var(--ink);background:var(--ink)}.workout-list.sorting{display:grid;grid-template-columns:1fr;overflow:clip}.workout-list.sorting,.workout-list.sorting *{user-select:none;-webkit-user-select:none}.workout-list.sorting .workout-card{transition:transform .3s cubic-bezier(.2,.9,.25,1.25),opacity .2s ease,background .2s ease;border-radius:.2s ease}.workout-list.sorting .drag-handle{touch-action:none;cursor:grab}.workout-list.sorting .drag-handle.is-grabbing{cursor:grabbing}.workout-list.sorting .workout-card.dragging{z-index:2;opacity:.82;background:var(--soft);border-color:var(--orange);pointer-events:none}
    .profile-tab{margin-left:auto}.log-tab{border:1px solid color-mix(in srgb,var(--ink) 28%,transparent)}.log-tab.active{border-color:var(--ink)}.theme-btn{background:var(--ink);border-color:var(--ink);color:var(--card)}body.dark .theme-btn{background:var(--card);border-color:var(--card);color:var(--ink)}.calorie-panel{margin-top:19px;padding:15px;border:1px solid var(--line);border-radius:14px}.calorie-heading{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:14px}.calorie-heading span{color:var(--muted);font-size:12px}.calorie-chart{display:flex;align-items:end;gap:9px;height:132px;border-bottom:1px solid var(--line);padding:0 4px}.calorie-bar{flex:1;min-width:30px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%;font-size:10px;color:var(--muted)}.calorie-bar i{display:block;width:100%;min-height:8px;border-radius:6px 6px 0 0;background:var(--orange);transition:height .25s ease}.calorie-bar.current i{background:var(--ink)}.calorie-bar b{color:var(--ink);font-size:11px}.calorie-bar small{white-space:nowrap}.profile-tab{border:1px solid var(--line)}.profile-tab.active{border-color:var(--ink)}#profileLog{padding:4px;border-radius:14px;background:var(--card)}#profileLog .grid{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}#profileLog .field select{display:block;width:100%;height:45px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:var(--card);color:var(--ink);font:inherit;appearance:auto}#profileLog .field select:focus{outline:2px solid var(--orange);border-color:var(--orange)}.delete-history{border:1px solid var(--red);border-radius:8px;padding:6px 9px;background:transparent;color:var(--red);font:inherit;font-size:12px;font-weight:700;cursor:pointer}@media(max-width:560px){.profile-tab{margin-left:0}.calorie-heading{display:block}.calorie-heading span{display:block;margin-top:3px}}
    /* ── 디자인 리프레시: CSS만 변경, 기능·데이터 흐름 영향 없음 ── */
    body{font-family:"Pretendard","Pretendard Variable",ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
    .shell{max-width:880px;padding:26px 20px 72px}
    header{margin-bottom:16px}
    .brand{font-size:22px;letter-spacing:-.8px}
    .brand i{width:12px;height:12px;border-radius:4px;background:var(--accent);vertical-align:1px}
    .date{font-weight:600}
    .theme-btn,body.dark .theme-btn{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:12.5px}
    .theme-btn:hover,body.dark .theme-btn:hover{border-color:var(--ink)}
    /* 상단 탭: 세그먼트 컨트롤 */
    .log-tabs{flex-wrap:nowrap;gap:4px;margin:0 0 16px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
    .log-tab,.profile-tab{flex:1;margin:0;padding:9px 10px;border:1px solid transparent;border-radius:999px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
    .log-tab:hover{color:var(--ink);background:var(--paper)}
    .log-tab.active,.profile-tab.active,.log-tab.active:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}
    .panel{border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow)}
    h1{font-size:24px;letter-spacing:-.8px}
    .sub{margin-bottom:22px;font-size:14px}
    .section{padding:24px 0}
    h2{display:flex;align-items:center;font-size:16px}
    .step{flex:none;width:24px;height:24px;background:var(--soft);color:var(--accent);font-weight:800}
    /* 입력 */
    .field input,.field textarea,.direct-add select,.direct-add input,.set-row input,.note textarea{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);transition:border-color .15s,box-shadow .15s}
    .field input,.direct-add select,.direct-add input{height:44px;padding:0 12px}
    .field input:focus,.field textarea:focus,.direct-add select:focus,.direct-add input:focus,.set-row input:focus,.note textarea:focus,#profileLog .field select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
    .field input:disabled{opacity:1;background:var(--paper);color:var(--muted)}
    .field label,.memo-label{font-weight:600}
    /* 부위·종목 선택 */
    .part{padding:8px 15px;border-color:var(--line);transition:border-color .15s,background .15s,color .15s}
    .part:hover{border-color:var(--accent);color:var(--accent)}
    .part[aria-pressed="true"],.part[aria-pressed="true"]:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .part-group{border-left:3px solid var(--accent);padding-left:14px}
    .exercise-option label{border-radius:var(--r-sm);padding:8px 12px;transition:border-color .15s,background .15s}
    .exercise-option label:hover{border-color:var(--muted)}
    .exercise-option input:checked+label{border-color:var(--accent);background:var(--soft);color:var(--ink)}
    .exercise-option input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
    /* 종목 카드 */
    .workout-card{background:var(--card);border-radius:var(--r-md);padding:14px 16px;transition:border-color .15s}
    .workout-card:not(.collapsed){border-color:color-mix(in srgb,var(--ink) 16%,var(--line))}
    .workout-card h3{font-size:15.5px}
    .toggle-mark{margin-left:2px;font-size:11px}
    .remove-exercise{padding:4px 7px;border-radius:6px;color:var(--muted);font-size:12.5px}
    .remove-exercise:hover,.delete-set:hover{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
    .set-row input{height:40px;padding:0 10px}
    .set-no{color:var(--muted);font-size:13px}
    .delete-set{height:32px;border-radius:6px;color:var(--muted)}
    .add-set{width:100%;border-style:dashed;color:var(--muted)}
    .add-set:hover{border-color:var(--accent);color:var(--accent)}
    /* 버튼 */
    .btn{border-radius:var(--r-sm);transition:border-color .15s,background .15s,color .15s}
    .btn:hover{border-color:var(--ink)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
    .sort-btn,.sort-btn:hover{padding:6px 12px;border-radius:999px;background:var(--card);color:var(--ink)}
    .sort-btn{border-color:var(--line)}
    .sort-btn:hover{border-color:var(--ink)}
    .section:has(.workout-list.sorting) .sort-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    /* 저장 결과·칼로리·팁 */
    .saved{padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r-md)}
    .comparison div{border-left-color:var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--card);line-height:1.6}
    .calorie-panel{margin-top:22px;padding:16px 18px;border-radius:var(--r-md);background:var(--paper)}
    .calorie-chart{gap:8px}
    .calorie-bar i{border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--accent) 45%,var(--card))}
    .calorie-bar.current i{background:var(--accent)}
    .calorie-bar b{font-size:10.5px}
    .tip{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);font-size:12.5px;line-height:1.55}
    .tip b{color:var(--accent)}
    /* 지난 운동 일지 */
    .history-tabs{gap:6px;margin:-6px 0 14px}
    .history-tab{padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    .history-tab:hover{border-color:var(--muted);color:var(--ink)}
    .history-tab.date.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .history-tab.part.active{background:var(--ink);border-color:var(--ink);color:var(--card)}
    .history-parts{gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper)}
    .history-part{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-size:13px}
    .history-part:hover{border-color:var(--muted);color:var(--ink)}
    .history-part.active,.history-part.active:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}
    .history-row{padding:14px 10px;transition:background .15s}
    .history-row:hover{background:var(--paper)}
    .history-row b{font-variant-numeric:tabular-nums}
    .history-detail{margin:4px 0 14px}
    .history-card{margin-top:10px;border-radius:var(--r-md);background:var(--paper)}
    .delete-history{border-radius:999px;background:var(--card)}
    .delete-history:hover{background:var(--red);color:#fff}
    /* 내 신체 정보 */
    #profileLog{padding:0;background:transparent}
    #profileLog .grid{border-radius:var(--r-md)}
    #profileLog .field select{height:44px;border-radius:var(--r-sm)}
    /* 신체 정보 미입력 시 칼로리 안내 */
    .calorie-empty{align-self:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:13px}
    .calorie-empty .btn{padding:8px 14px;font-size:13px}
    /* 종목 카드: 실패 지점 체크 */
    .failure-check{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13.5px;font-weight:600;cursor:pointer}
    .failure-check input{flex:none;width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}
    .failure-check small{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:400}
    .failure-check:has(input:checked){border-color:var(--accent);background:var(--soft)}
    /* 직접 추가한 종목: 목록에서 삭제 버튼 */
    .exercise-option.custom label{padding-right:30px}
    .remove-custom{position:absolute;top:50%;right:5px;transform:translateY(-50%);width:22px;height:22px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--muted);font:inherit;font-size:15px;line-height:22px;text-align:center;cursor:pointer}
    .remove-custom:hover,.remove-custom:focus-visible{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);outline:0}
    /* 종목 순서 조정: 튕기는 전환 제거, 잡은 카드는 살짝 떠오르는 느낌 */
    .workout-list.sorting{position:relative;overflow:visible}
    .workout-list.sorting .workout-card{transition:none}
    .workout-list.sorting .drag-handle{padding:6px 8px;margin:-6px 4px -6px -8px;border-radius:6px}
    .workout-list.sorting .drag-handle:hover{color:var(--accent);background:var(--soft)}
    .workout-list.sorting .workout-card.dragging,.workout-list.sorting .workout-card.settling{position:relative;z-index:5}
    .workout-list.sorting .workout-card.dragging{opacity:1;pointer-events:auto;background:var(--card);border-color:var(--accent);box-shadow:var(--lift)}
    .workout-list.sorting .workout-card.dragging .drag-handle{color:var(--accent)}
    @media(max-width:560px){
      .shell{padding:16px 12px 110px}
      .panel{padding:20px 16px;border-radius:16px}
      .log-tab,.profile-tab{padding:9px 4px;font-size:13px}
      h1{font-size:22px}
      /* 휴대폰: 저장 버튼을 화면 하단에 고정 */
      #currentLog .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgb(0 0 0/.06)}
      #currentLog .actions .btn{flex:1;height:46px}
      #currentLog .actions .btn.primary{flex:2}
    }
  </style>

<body>
  <div class="shell">
    <header><div class="brand"><i></i>LiftLog</div><div class="header-right"><div class="date" id="today"></div><button class="btn theme-btn" type="button" id="themeToggle">블랙 모드</button></div></header>
    <div class="log-tabs" role="tablist"><button class="log-tab active" type="button" data-view="currentLog">오늘 운동 기록</button><button class="log-tab" type="button" data-view="historyLog">지난 운동 일지</button><button class="log-tab profile-tab" type="button" data-view="profileLog">내 신체 정보</button></div>
    <main class="panel">
      <div class="view" id="currentLog">
      <h1>운동 기록</h1><p class="sub">오늘 한 운동을 순서대로 편하게 남겨보세요.</p>
      <section class="section"><h2><span class="step">1</span>언제, 어디서 운동했나요?</h2><div class="grid"><div class="field"><label for="workoutDate">날짜</label><input id="workoutDate" type="date"></div><div class="field"><label for="startTime">운동 시작 시간</label><input id="startTime" type="time"></div><div class="field"><label for="endTime">운동 종료 시간</label><input id="endTime" type="time"></div><div class="field"><label for="duration">총 운동 시간</label><input id="duration" type="text" placeholder="종료 시간 입력 시 계산" disabled></div><div class="field full"><label for="location">운동 장소</label><input id="location" type="text" placeholder="예: 집 근처 헬스장, 성수 PT 스튜디오"></div><div class="field full"><label for="partner">운동 파트너</label><input id="partner" type="text" placeholder="함께 운동한 사람 이름을 적어주세요 (혼자라면 비워두세요)"></div></div></section>
      <section class="section"><h2><span class="step">2</span>운동 부위를 골라주세요</h2><p class="part-hint">여러 부위를 중복해서 선택할 수 있어요.</p><div class="parts" id="parts"></div></section>
      <section class="section"><h2><span class="step">3</span>어떤 운동을 했나요?</h2><div id="exerciseArea" class="exercise-area"></div></section>
      <section class="section"><div class="section-heading"><h2><span class="step">4</span>세트와 기록을 남겨주세요</h2><button type="button" class="btn sort-btn" id="sortExercises">종목 순서 조정</button></div><div id="workoutList" class="workout-list"><div class="empty">운동 부위와 종목을 먼저 선택해주세요.</div></div></section>
      <section class="section"><h2><span class="step">5</span>오늘 운동은 어땠나요?</h2><div class="note"><label class="memo-label" for="dayMemo">전체 특이사항</label><textarea id="dayMemo" placeholder="예: 컨디션이 좋아서 계획보다 한 세트 더 했어요. 점심을 못 먹어서 후반에 힘이 빠졌어요."></textarea></div><div class="actions"><button type="button" class="btn primary" id="save">오늘 운동 저장</button><button type="button" class="btn" id="example">예시 채우기</button></div><div id="saved" class="saved"></div><section class="calorie-panel" aria-label="최근 운동 칼로리"><div class="calorie-heading"><b>최근 운동 칼로리</b><span>신체 정보와 운동 기록 기반 추정</span></div><div id="calorieChart" class="calorie-chart"></div></section><p class="tip" id="trendTip"></p></section>
      </div>
      <div class="view" id="historyLog" hidden><h1>지난 운동 일지</h1><p class="sub">예시 기록과 저장한 운동을 날짜 순서로 확인할 수 있어요.</p><div id="historyList"></div></div>
      <div class="view" id="profileLog" hidden><h1>내 신체 정보</h1><p class="sub">칼로리 추정과 회복 안내에 사용하는 기본 정보예요.</p><div class="grid"><div class="field"><label for="profileHeight">키 (cm)</label><input id="profileHeight" type="number" min="100" placeholder="예: 175"></div><div class="field"><label for="profileWeight">몸무게 (kg)</label><input id="profileWeight" type="number" min="30" step="0.1" placeholder="예: 72"></div><div class="field"><label for="profileBodyFat">체지방률 (%)</label><input id="profileBodyFat" type="number" min="1" max="70" step="0.1" placeholder="예: 18"></div><div class="field"><label for="profileHydration">체수분 (%)</label><input id="profileHydration" type="number" min="20" max="80" step="0.1" placeholder="예: 55"></div><div class="field"><label for="profileAge">나이</label><input id="profileAge" type="number" min="10" max="100" placeholder="예: 28"></div><div class="field"><label for="profileSex">성별</label><select id="profileSex"><option value="">선택 안 함</option><option>여성</option><option>남성</option><option>기타</option></select></div></div><div class="actions"><button type="button" class="btn primary" id="saveProfile">신체 정보 저장</button></div><div id="profileSaved" class="saved"></div></div>
    </main>
  </div>
  <script>
    const catalog={가슴:['벤치프레스','인클라인 덤벨 프레스','체스트 프레스','케이블 플라이','딥스'],등:['랫풀다운','바벨 로우','시티드 케이블 로우','풀업','원암 덤벨 로우'],하체:['스쿼트','레그프레스','레그 익스텐션','레그 컬','루마니안 데드리프트'],어깨:['숄더프레스','사이드 레터럴 레이즈','리어 델트 플라이','페이스풀'],이두:['바벨 컬','덤벨 컬','해머 컬','프리처 컬'],삼두:['트라이셉스 푸시다운','오버헤드 익스텐션','라잉 트라이셉스 익스텐션','딥스'],복근:['크런치','레그 레이즈','플랭크','케이블 크런치'],유산소:['러닝머신','실내 사이클','스텝밀','일립티컬','로잉머신','야외 러닝','수영']};
    const state={parts:new Set(),selected:new Set(),customParts:new Map()}; const historyState={mode:'date',part:'전체',open:null}; let sortMode=false,draggedCard=null; const $=s=>document.querySelector(s); const today=new Date(),pad=n=>String(n).padStart(2,'0');
    $('#today').textContent=today.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});$('#workoutDate').value=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;$('#startTime').value=`${pad(today.getHours())}:${pad(today.getMinutes())}`;
    function updateDuration(){const start=$('#startTime').value,end=$('#endTime').value;if(!start||!end){$('#duration').value='';return}let minutes=(+end.slice(0,2)*60+(+end.slice(3)))-(+start.slice(0,2)*60+(+start.slice(3)));if(minutes<0)minutes+=1440;$('#duration').value=`${Math.floor(minutes/60)}시간 ${minutes%60}분`}
    $('#startTime').onchange=updateDuration;$('#endTime').onchange=updateDuration;
    const getProfile=()=>JSON.parse(localStorage.getItem('liftlog-profile')||'{}');
    function loadProfile(){const profile=getProfile();[['profileHeight','height'],['profileWeight','weight'],['profileBodyFat','bodyFat'],['profileHydration','hydration'],['profileAge','age'],['profileSex','sex']].forEach(([id,key])=>{$('#'+id).value=profile[key]??''})}
    /* ── 칼로리 추정 ──
       kcal = Σ MET × 시간당 기초대사량 × 시간. 기초대사량은 Mifflin-St Jeor(키·몸무게·나이·성별), 일부가 비면 체중(kg)/h로 대체.
       기록마다 저장 당시 신체 정보(profileSnapshot)로 계산하고, 그 필드가 없는 기존 기록은 LEGACY_PROFILE 기준으로 계산합니다. */
    const LEGACY_PROFILE={height:172,weight:74,age:22,sex:'남성'};
    const PART_MET={하체:6,가슴:5,등:5,어깨:4.5,이두:3.8,삼두:3.8,복근:3.8,기타:4.5};
    const hasBodyWeight=profile=>+(profile&&profile.weight)>0;
    function restingKcalPerHour(profile){const kg=+profile.weight,cm=+profile.height,age=+profile.age;if(cm>0&&age>0&&(profile.sex==='남성'||profile.sex==='여성'))return(10*kg+6.25*cm-5*age+(profile.sex==='남성'?5:-161))/24;return kg}
    function cardioMet(name,speed){const text=String(name||'');if(/러닝|런닝|트레드|걷기|워킹|조깅/.test(text)){if(!speed)return 7;return speed<6.5?Math.max(2.8,3.5+(speed-4.8)*0.9):Math.max(6,1.02*speed)}if(/사이클|바이크|자전거/.test(text))return 7;if(/스텝/.test(text))return 9;if(/일립|엘립/.test(text))return 5;if(/로잉/.test(text))return 7;if(/수영/.test(text))return 7;return 6}
    function workoutMinutes(record){const text=String(record.durationMinutes||''),hours=+(text.match(/(\d+)\s*시간/)||[])[1]||0,mins=+(text.match(/(\d+)\s*분/)||[])[1]||0;let minutes=hours*60+mins;const isTime=value=>/^\d{1,2}:\d{2}$/.test(value||''),toMin=value=>+value.split(':')[0]*60+(+value.split(':')[1]);if(!minutes&&isTime(record.startTime)&&isTime(record.endTime))minutes=(toMin(record.endTime)-toMin(record.startTime)+1440)%1440;if(minutes)return{minutes,estimated:false};const exercises=record.exercises||[],sets=exercises.reduce((sum,ex)=>sum+(ex.sets||[]).length,0);return{minutes:sets?Math.min(100,Math.max(30,Math.round(sets*3.5))):exercises.length*12,estimated:true}}
    function calorieProfileFor(record){if(!record||!('profileSnapshot' in record))return LEGACY_PROFILE;return hasBodyWeight(record.profileSnapshot)?record.profileSnapshot:getProfile()}
    function estimateCalories(record){const profile=calorieProfileFor(record);if(!hasBodyWeight(profile))return null;const perHour=restingKcalPerHour(profile),{minutes,estimated}=workoutMinutes(record),exercises=record.exercises||[];let cardioMinutes=0,kcal=0;exercises.filter(ex=>ex.part==='유산소').forEach(ex=>(ex.sets||[]).forEach(set=>{const m=+set.weight||0;cardioMinutes+=m;kcal+=cardioMet(ex.exercise,+set.reps||0)*perHour*m/60}));const strength=exercises.filter(ex=>ex.part!=='유산소'),strengthMinutes=Math.max(0,minutes-cardioMinutes);if(strength.length&&strengthMinutes){const setCounts=strength.map(ex=>(ex.sets||[]).length),totalSets=setCounts.reduce((a,b)=>a+b,0);strength.forEach((ex,i)=>{const share=totalSets?setCounts[i]/totalSets:1/strength.length;kcal+=(PART_MET[ex.part]||4.5)*perHour*strengthMinutes*share/60})}else if(!exercises.length&&minutes){kcal+=Math.max(...(record.parts||[]).map(part=>PART_MET[part]||4.5),4.5)*perHour*minutes/60}return{kcal:Math.round(kcal),minutes:Math.max(minutes,cardioMinutes),estimated}}
    function renderCalories(){const chart=$('#calorieChart');if(!chart)return;if(!hasBodyWeight(getProfile())){chart.innerHTML='<div class="calorie-empty"><span>내 신체 정보를 입력하면 운동 칼로리를 계산해 드려요.</span><button class="btn" type="button" id="goProfile">신체 정보 입력</button></div>';$('#goProfile').onclick=()=>document.querySelector('.log-tab[data-view="profileLog"]').click();return}const records=JSON.parse(localStorage.getItem('liftlog-records-v2')||'[]').map((record,index)=>[record,index]).sort((a,b)=>String(a[0].date||'').localeCompare(String(b[0].date||''))||a[1]-b[1]).slice(-7).map(([record])=>record);if(!records.length){chart.innerHTML='<div class="empty">운동을 저장하면 최근 칼로리 추세가 표시됩니다.</div>';return}const results=records.map(estimateCalories),values=results.map(result=>result?.kcal||0),max=Math.max(...values,1);chart.innerHTML=records.map((record,index)=>`<div class="calorie-bar ${index===records.length-1?'current':''}" title="${results[index]?.estimated?'운동 시간이 없어 세트 수로 추정':''}"><b>${values[index]?`${results[index].estimated?'≈':''}${values[index]} kcal`:'–'}</b><i style="height:${Math.max(10,values[index]/max*88)}%"></i><small>${(record.date||'').slice(5).replace('-','/')||'기록'}</small></div>`).join('')}
    function renderTip(){const tips=['점진적 과부하: 중량·횟수·세트 중 하나만 소폭 올려도 충분합니다.','RIR(남은 반복 수)을 1–3회 정도 남기면 강도와 회복의 균형을 잡기 좋습니다.','매 세트 실패보다, 일정한 자세와 가동범위를 유지하는 것이 장기적인 성장에 더 유리합니다.','유산소는 심박수·시간·주당 빈도를 함께 기록하면 체력 변화를 보기 쉽습니다.','휴식과 수면도 운동량의 일부예요. 고강도 세션 뒤에는 같은 부위의 회복을 우선하세요.'];const count=JSON.parse(localStorage.getItem('liftlog-records-v2')||'[]').length;$('#trendTip').innerHTML=`<b>Tip</b> · ${tips[count%tips.length]}`}
    function renderParts(){$('#parts').innerHTML=Object.keys(catalog).map(part=>`<button class="part" type="button" aria-pressed="${state.parts.has(part)}" data-part="${part}">${part}</button>`).join('');document.querySelectorAll('.part').forEach(button=>button.onclick=()=>{const part=button.dataset.part;if(state.parts.has(part)){state.parts.delete(part);[...state.selected].forEach(ex=>{if(partFor(ex)===part)state.selected.delete(ex)})}else state.parts.add(part);renderParts();renderExercises();renderWorkouts()})}
    /* ── 직접 추가한 종목: liftlog-custom-exercises 에 {부위:[종목명]} 으로 영구 저장 (운동 기록 데이터와는 별개) ── */
    const getCustomExercises=()=>{try{const saved=JSON.parse(localStorage.getItem('liftlog-custom-exercises')||'{}');return saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{}}catch(error){return{}}};
    const saveCustomExercises=map=>localStorage.setItem('liftlog-custom-exercises',JSON.stringify(map));
    const isCustomExercise=(part,name)=>(getCustomExercises()[part]||[]).includes(name)&&!(catalog[part]||[]).includes(name);
    const exercisesFor=part=>[...new Set([...(catalog[part]||[]),...(getCustomExercises()[part]||[])])];
    /* 실제 일지 설치 후 1회: 예전 일지에서 같은 부위로 2번 이상 한 종목을 목록에 등록. 사용자가 지운 종목은 다시 생기지 않습니다. */
    function seedCustomFromHistory(){if(localStorage.getItem('liftlog-custom-seeded-v1')||!localStorage.getItem('liftlog-real-diary-v1'))return;const records=JSON.parse(localStorage.getItem('liftlog-records-v2')||'[]');if(!records.length)return;const counts=new Map;records.forEach(record=>(record.exercises||[]).forEach(ex=>{const name=String(ex.exercise||'').trim(),part=ex.part;if(!name||!catalog[part]||name.includes('(')||catalog[part].includes(name))return;const key=JSON.stringify([part,name]);counts.set(key,(counts.get(key)||0)+1)}));const map=getCustomExercises();[...counts.entries()].filter(([,count])=>count>=2).sort((a,b)=>b[1]-a[1]).forEach(([key])=>{const [part,name]=JSON.parse(key),usedElsewhere=Object.entries(catalog).some(([p,items])=>p!==part&&items.includes(name))||Object.entries(map).some(([p,items])=>p!==part&&(items||[]).includes(name));if(usedElsewhere)return;map[part]=map[part]||[];if(!map[part].includes(name))map[part].push(name)});saveCustomExercises(map);localStorage.setItem('liftlog-custom-seeded-v1','true')}
    function renderExercises(){const area=$('#exerciseArea');if(!state.parts.size){area.innerHTML='<div class="empty">운동 부위를 선택하면 해당 부위의 종목과 직접 추가 칸이 여기 나타납니다.</div>';return}let optionId=0;area.innerHTML=[...state.parts].map(part=>`<div class="part-group"><div class="part-title">${part}</div><div class="exercise-options">${exercisesFor(part).map(ex=>{const id=`ex-opt-${optionId++}`,custom=isCustomExercise(part,ex);return `<div class="exercise-option${custom?' custom':''}"><input type="checkbox" id="${id}" value="${escapeHTML(ex)}" ${state.selected.has(ex)?'checked':''}><label for="${id}">${escapeHTML(ex)}</label>${custom?`<button type="button" class="remove-custom" data-part="${escapeHTML(part)}" data-name="${escapeHTML(ex)}" title="목록에서 삭제" aria-label="${escapeHTML(ex)} 목록에서 삭제">×</button>`:''}</div>`}).join('')}</div></div>`).join('')+`<div class="direct-add"><select id="customPart" aria-label="직접 추가 운동 부위">${[...state.parts].map(p=>`<option value="${p}">${p}</option>`).join('')}</select><input id="customExercise" type="text" placeholder="직접 운동 종목을 작성하세요"><button class="btn" type="button" id="addCustom">종목 추가</button></div>`;area.querySelectorAll('.exercise-option input').forEach(input=>input.onchange=()=>{input.checked?state.selected.add(input.value):state.selected.delete(input.value);renderWorkouts()});area.querySelectorAll('.remove-custom').forEach(button=>button.onclick=()=>{const {part,name}=button.dataset;if(!confirm(`'${name}' 종목을 목록에서 삭제할까요?\n지난 운동 기록은 그대로 남아요.`))return;const map=getCustomExercises();map[part]=(map[part]||[]).filter(item=>item!==name);if(!map[part].length)delete map[part];saveCustomExercises(map);if(state.selected.has(name))state.customParts.set(name,part);renderExercises()});$('#addCustom').onclick=()=>{const input=$('#customExercise'),name=input.value.trim(),part=$('#customPart').value;if(!name){input.focus();return}const existingPart=partFor(name);if(existingPart&&existingPart!==part&&!(catalog[part]||[]).includes(name)){alert('같은 이름의 종목이 이미 다른 부위에 있어요. 이름을 조금 다르게 적어주세요.');return}if(!(catalog[part]||[]).includes(name)){const map=getCustomExercises();map[part]=map[part]||[];if(!map[part].includes(name))map[part].push(name);saveCustomExercises(map)}state.customParts.set(name,part);state.selected.add(name);input.value='';renderExercises();renderWorkouts()}}
    function partFor(exercise){return state.customParts.get(exercise)||Object.entries(catalog).find(([,items])=>items.includes(exercise))?.[0]||Object.entries(getCustomExercises()).find(([,items])=>(items||[]).includes(exercise))?.[0]||''}function setRow(n,part,previous={}){const cardio=part==='유산소',a=cardio?'시간':'중량',b=cardio?'속도':'횟수',unitA=cardio?'분':'kg',unitB=cardio?'km/h':'회';const previousA=previous.weight!==undefined?`이전 ${previous.weight}${unitA}`:unitA,previousB=previous.reps!==undefined?`이전 ${previous.reps}${unitB}`:unitB;return `<div class="set-row"><span class="set-no">${n}세트</span><input type="number" min="0" step="${cardio?'1':'0.5'}" aria-label="${n}세트 ${a}" placeholder="${previousA}"><input type="number" min="${cardio?'0':'1'}" step="${cardio?'0.1':'1'}" aria-label="${n}세트 ${b}" placeholder="${previousB}"><button class="delete-set" type="button" aria-label="세트 삭제">×</button></div>`}
    function lastExercise(exercise){const records=JSON.parse(localStorage.getItem('liftlog-records-v2')||'[]');for(let i=records.length-1;i>=0;i--){const found=(records[i].exercises||[]).find(item=>item.exercise===exercise);if(found)return found}return null}
    function wireCard(card){const rows=card.querySelector('.set-rows'),part=card.dataset.part,handle=card.querySelector('.drag-handle');const renumber=()=>rows.querySelectorAll('.set-row').forEach((row,i)=>row.querySelector('.set-no').textContent=`${i+1}세트`);const wireRows=()=>rows.querySelectorAll('.delete-set').forEach(btn=>btn.onclick=()=>{if(rows.children.length===1){alert('최소 한 세트는 남겨주세요.');return}btn.closest('.set-row').remove();renumber()});card.querySelector('.add-set').onclick=()=>{rows.insertAdjacentHTML('beforeend',setRow(rows.children.length+1,part));wireRows()};wireRows();card.querySelector('.card-toggle').onclick=()=>{if(sortMode)return;card.classList.toggle('collapsed');const collapsed=card.classList.contains('collapsed');card.querySelector('.card-toggle').setAttribute('aria-expanded',String(!collapsed));card.querySelector('.toggle-mark').textContent=collapsed?'▼':'▲'};card.querySelector('.remove-exercise').onclick=()=>{state.selected.delete(card.dataset.exercise);renderExercises();renderWorkouts()};/* 종목 순서 조정 (마우스·터치 공통, 세로 이동만).
       드래그 중에는 DOM 순서를 바꾸지 않습니다. 잡은 카드는 손가락을 지연 없이 따라오고, 나머지 카드는 transform으로만 비켜 줍니다.

    const actualParts = ['하체','등','가슴','어깨','이두','삼두','복근','유산소'];
    const actualPartFor = (name, parts) => {
      const text = String(name || '');
      if (/러닝|사이클|스텝|엘립|로잉|걷기|유산소/.test(text)) return '유산소';
      if (/스쿼트|레그|런지|힙|카프|익스텐션/.test(text)) return '하체';
      if (/랫|풀업|로우|풀다운|데드리프트/.test(text)) return '등';
      if (/이두|컬|헤머/.test(text)) return '이두';
      if (/삼두|트라이|푸시다운|오버헤드 익스텐션/.test(text)) return '삼두';
      if (/벤치|인클라인|체스트|펙덱|버터플라이|딥스|푸쉬/.test(text)) return '가슴';
      if (/숄더|사레레|리버스|오버헤드|비하인드/.test(text)) return '어깨';
      return parts[0] || '기타';
    };
    function actualSets(detail, part) {
      const plain = String(detail || '').replace(/,/g, '');
      if (part === '유산소') {
        const mins = +(plain.match(/(\d+(?:\.\d+)?)\s*분/) || [])[1] || 0;
        const speed = +(plain.match(/(?:속도\s*)?(\d+(?:\.\d+)?)\s*(?:km|키로)/i) || [])[1] || 0;
        return mins || speed ? [{ weight: mins, reps: speed }] : [];
      }
      const weight = +(plain.match(/(\d+(?:\.\d+)?)\s*(?:키로|kg)/i) || [])[1] || 0;
      const reps = +(plain.match(/(?:×|x|\s)(\d+(?:\.\d+)?)\s*회/i) || [])[1] || 0;
      const count = +(plain.match(/(?:×|x|\s)(\d+)\s*(?:세트|set)/i) || [])[1] || 1;
      return weight || reps ? Array.from({ length: Math.min(Math.max(count, 1), 12) }, () => ({ weight, reps })) : [];
    }
    function parseActualDiary(text) {
      const header = /^(?:운동\s*일지\s*-\s*)?(\d{2})[.\s]+(\d{1,2})[.\s]+(\d{1,2})\s+([^\n]*)$/gm;
      const matches = [...text.matchAll(header)];
      return matches.map((match, index) => {
        const [, yy, mm, dd, title] = match;
        const date = `20${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
        const body = text.slice(match.index + match[0].length, index + 1 < matches.length ? matches[index + 1].index : text.length).trim();
        const parts = actualParts.filter(part => title.includes(part));
        const sessionParts = parts.length ? parts : ['기타'];
        const time = title.match(/(\d{1,2})[;:](\d{2})\s*(?:~|–|-)\s*(\d{1,2})[;:](\d{2})/);
        const startTime = time ? `${time[1].padStart(2,'0')}:${time[2]}` : '';
        const endTime = time ? `${time[3].padStart(2,'0')}:${time[4]}` : '';
        const durationMinutes = time ? `${((+time[3] * 60 + +time[4]) - (+time[1] * 60 + +time[2]) + 1440) % 1440}분` : '';
        const exercises = body.split(/\r?\n/).map(line => line.trim()).filter(line => /^[^☆\n]{2,40}[:;]/.test(line)).map(line => {
          const [exercise, ...rest] = line.split(/[:;]/); const name = exercise.trim(); const detail = rest.join(':').trim(); const part = actualPartFor(name, sessionParts);
          return { exercise: name, part, sets: actualSets(detail, part), memo: detail };
        }).filter(exercise => exercise.exercise && !/^운동/.test(exercise.exercise));
        const finalParts = [...new Set(exercises.map(exercise => exercise.part).filter(part => part !== '기타').concat(sessionParts.filter(part => part !== '기타')))] || sessionParts;
        return { date, startTime, endTime, durationMinutes, location: (title.match(/\(([^)]+)\)/) || [])[1] || '', partner: '', parts: finalParts, exercises, dayMemo: body || title.trim(), savedAt: `${date}T${startTime || '12:00'}:00.000Z` };
      }).filter(record => record.date && (record.exercises.length || record.dayMemo));
    }
    async function installActualDiary() {
      if (localStorage.getItem('liftlog-real-diary-v1')) return;

        localStorage.setItem('liftlog-real-diary-v1', 'true');
        localStorage.removeItem('liftlog-demo-v3');
        historyState.open = null;
        renderHistory(); renderCalories(); renderTip();
      } catch (error) {
        console.warn('실제 운동 일지 가져오기 실패:', error);
      }
    }
    installActualDiary().then(()=>{if(localStorage.getItem('liftlog-custom-seeded-v1'))return;seedCustomFromHistory();renderExercises()});
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(error => console.warn('오프라인 지원 등록 실패:', error)));
    }
  </script>
</body>
</html>
